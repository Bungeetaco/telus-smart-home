# Requires --network host (see README's "Network requirement" section) --
# Janus/WebRTC negotiates a wide ephemeral UDP port range for RTP that doesn't
# play well with Docker's default bridge networking + NAT, and the control
# endpoint's loopback-only design depends on sharing the host's network
# namespace with the Home Assistant container.
#
# HOST_SHARED_DIR (in .env) is the host-side path for the directory this
# shares with Home Assistant's own container -- defaults to the Supervised
# layout. See the top-level README's "Non-Supervised installs" note if that
# path doesn't exist on your system.
#
# Credentials live in secrets.env, deliberately NOT named .env: Compose
# auto-interpolates ${...}-looking references inside whichever file is
# literally named .env (needed here so ${HOST_SHARED_DIR} below resolves),
# and a password containing a "$" -- entirely plausible for anything
# reasonably random -- gets silently mangled if it goes through that same
# interpolation pass. secrets.env, as an explicitly-named (not
# auto-interpolated) env_file, is passed to the container as literal
# key=value pairs with no such processing. Verified live: a real password
# with a "$" in it came through corrupted via .env and intact via
# secrets.env -- this isn't a theoretical concern, keep these files separate.
#
# /dev/dri passthrough + group_add is for hardware (QuickSync/VAAPI) video
# encoding in ffmpeg_sink.py -- the render node (/dev/dri/renderD128) is
# group-owned by "render" on the host, and this container runs as a
# non-root "bridge" user (see Dockerfile), so group_add grants that user
# access via GID rather than running privileged or as root. The GID below
# must match `getent group render` on the actual host -- override via a
# .env RENDER_GID if it differs from this project's dev/deploy hosts.
services:
  telus-cam-bridge:
    build: .
    image: telus-cam-bridge:latest
    container_name: telus-cam-bridge
    network_mode: host
    restart: unless-stopped
    env_file:
      - secrets.env
      - .env
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-992}"
    volumes:
      - ${HOST_SHARED_DIR:-/var/lib/homeassistant/share/telus_cam_bridge}:/shared
    # Measured live (2 cameras, always-warm): ~14-31% of one core, ~326MB RSS.
    # These caps leave generous headroom above that without being unbounded --
    # a runaway leak (see the FD/socket leak and wedged-session history in this
    # project) gets capped and OOM-killed into a clean restart instead of being
    # free to consume the whole host. Override via .env if a future host has
    # tighter constraints or more cameras change the real working set.
    mem_limit: ${BRIDGE_MEM_LIMIT:-768m}
    cpus: ${BRIDGE_CPU_LIMIT:-2.0}
    # No log rotation previously configured -- this container logs continuously
    # (ffmpeg stderr passthrough, per-frame drop warnings, connection state
    # changes for 2 always-on streams) and could grow the default json-file
    # driver's log unbounded over the container's lifetime.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # NVIDIA GPU support (opt-in, off by default -- this project's own host is
    # Intel-only and has not verified this section against real NVIDIA
    # hardware). To use: install nvidia-container-toolkit on the host, set
    # ENCODE_BACKEND=nvenc in .env (see config.py), remove the /dev/dri
    # devices/group_add block above if this host has no Intel/AMD GPU at all,
    # and uncomment below.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: ["gpu"]
