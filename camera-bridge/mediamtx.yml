rtsp: yes
rtspAddress: 127.0.0.1:8554
# The default 10s read timeout races bridge/config.py's FRAME_SILENCE_TIMEOUT_S
# (15s): when Alarm.com's RTP silently stalls mid-session, ffmpeg has nothing to
# send, and MediaMTX would kill the publisher connection at 10s -- destroying the
# path (kicking every reader, HLS discontinuity in HA) BEFORE the bridge's own
# silence watchdog could fire at 15s, reconnect, and bridge the gap with held
# frames (observed live 2026-07-18 01:22:50, "i/o timeout"). 30s covers the 15s
# detection plus a reconnect (~2-6s measured) with margin.
readTimeout: 30s
rtmp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
paths:
  # No on-demand hooks: as of 2026-07-18 the bridge (main.py) starts every known
  # camera's pipeline eagerly at process startup / discovery and keeps it running
  # forever -- see main.py's eager-activation comment. That trades the CPU savings
  # of the old gate-on-readers design (near-zero when nobody's viewing) for
  # always-warm streams with no cold-start latency, which is the right trade here
  # since the kiosk dashboard already keeps both cameras' live views on-screen
  # ~24/7 in practice (measured live: ~14% CPU, 326MB for 2 cameras -- the "idle"
  # case the old design optimized for barely occurs).
  #
  # This entry itself still can't be deleted, though: "all_others" is MediaMTX's
  # catch-all template for any path name not explicitly listed, and a path must
  # match SOME config entry (even an empty one) before MediaMTX will accept a
  # publisher to it at all -- confirmed live, removing this block entirely made
  # ffmpeg's RTSP ANNOUNCE get rejected with "435 Bad Request: path ... is not
  # configured" for both cameras. Empty body -- no runOnDemand/runOnUnDemand --
  # since the bridge is always the one initiating the publish now.
  all_others:
