rtsp: yes
rtspAddress: 127.0.0.1:8554
rtmp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
paths:
  all_others:
    # On-demand pipeline lifecycle: the bridge's Janus WebRTC session + software
    # decode/encode pipeline (camera_session.run_camera_forever) previously ran
    # continuously for every discovered camera, 24/7, regardless of whether anyone was
    # actually looking -- by far the largest CPU cost in this container. HA only opens
    # the upstream RTSP connection while a camera's live view is actually on-screen, so
    # gating the pipeline on MediaMTX's own reader tracking (which it already does
    # natively for exactly this use case) drops steady-state CPU to near zero the rest
    # of the time. MediaMTX itself holds a connecting reader open/waiting until a
    # publisher appears -- no race where a viewer's first request fails because nothing
    # was running yet.
    #
    # Both hook commands are documented in bridge/activate_camera.sh /
    # deactivate_camera.sh -- they don't publish anything themselves, they just tell the
    # already-running bridge process (which owns the one shared TELUS session) to
    # start/stop that specific camera's pipeline.
    runOnDemand: /app/bridge/activate_camera.sh
    runOnDemandRestart: no
    # Our pipeline's realistic startup latency comfortably exceeds MediaMTX's 10s
    # default -- a reader would see a failed/timed-out connection on nearly every
    # on-demand start otherwise. The actual worst case per bridge/camera_session.py:
    # connect_and_watch() is wrapped in asyncio.wait_for(..., WEBRTCUP_TIMEOUT_S+10=30s),
    # and only *after* that completes does the separate first-frame collection loop run,
    # up to FIRST_FRAME_TIMEOUT_S=20s -- these are sequential, not overlapping, so the
    # real worst case is ~50s, not the ~40s the previous 35s value assumed (which could
    # legitimately time out a slow-but-otherwise-fine camera start). 60s covers the
    # actual worst case with margin.
    runOnDemandStartTimeout: 60s
    # How long to keep a pipeline running with zero readers before tearing it down --
    # long enough that HA's normal viewer connect/reconnect churn (switching dashboard
    # views, brief card re-renders) doesn't cause start/stop thrashing, short enough
    # that "nobody's looking" still gets back to near-zero CPU within under a minute.
    runOnDemandCloseAfter: 45s
    runOnUnDemand: /app/bridge/deactivate_camera.sh
