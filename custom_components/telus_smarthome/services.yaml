speak:
  name: Speak through camera
  description: >-
    Play a spoken phrase (or an arbitrary audio clip) through a TELUS camera's
    speaker via two-way audio (talkdown). Only doorbell-class cameras with an
    upstream-audio path support this. Talkdown is enabled on the bridge by
    default (TALKDOWN_ENABLED). If no target is given, the doorbell is used.
  fields:
    entity_id:
      name: Camera
      description: Target TELUS camera entity. Defaults to the doorbell if omitted.
      required: false
      selector:
        entity:
          integration: telus_smarthome
          domain: camera
    message:
      name: Message
      description: >-
        Text to speak. Rendered to audio by Home Assistant's TTS engine (see
        `engine`), then handed to the camera bridge to play. Mutually exclusive
        with `media_content_id`.
      required: false
      example: "Hi, you are being recorded."
      selector:
        text:
    media_content_id:
      name: Media content id
      description: >-
        A media-source URI (e.g. media-source://tts/... or a media file) or a
        direct http(s) URL to play instead of `message`. Mutually exclusive with
        `message`.
      required: false
      example: "media-source://tts/google_translate?message=Hello"
      selector:
        text:
    engine:
      name: TTS engine
      description: >-
        TTS entity used to render `message`. Defaults to the first available TTS
        engine (e.g. tts.google_translate or Nabu Casa cloud).
      required: false
      selector:
        entity:
          domain: tts
    language:
      name: Language
      description: Language code passed to the TTS engine when rendering `message`.
      required: false
      selector:
        text:
    conditioning:
      name: Audio conditioning
      description: >-
        Whether the bridge runs its default ffmpeg conditioning chain over the
        audio before playing it. Set to false to play the clip exactly as
        decoded. Leave unset to keep the bridge's own default.
      required: false
      selector:
        boolean:
    audio_filter:
      name: Audio filter
      description: >-
        An explicit ffmpeg `-af` filter chain the bridge runs instead of the
        default conditioning (overrides `conditioning`). An empty string
        disables conditioning entirely. Leave unset to keep the bridge's own
        default.
      required: false
      example: "volume=6dB,highpass=f=200"
      selector:
        text:

bypass_sensors:
  name: Bypass sensors
  description: >-
    Bypass or un-bypass specific alarm sensors on the security panel, right now.
    A BYPASSED SENSOR WILL NOT TRIGGER THE ALARM until it is un-bypassed --
    opening that door or window while the system is armed does nothing at all.
    Bypasses stay in place until you remove them here or in the TELUS app. This
    is a manual action and is separate from the "Force Bypass" arming option,
    which bypasses whatever happens to be open at the moment you arm. Give at
    least one sensor in either field. Many panels refuse to change a bypass
    while the partition is armed; the service says so rather than half-applying.
  fields:
    bypass:
      name: Bypass
      description: >-
        Sensors to bypass. Each will stop triggering the alarm until it is
        un-bypassed.
      required: false
      example: "binary_sensor.back_door"
      selector:
        entity:
          multiple: true
          integration: telus_smarthome
          domain: binary_sensor
    unbypass:
      name: Un-bypass
      description: >-
        Sensors to return to normal, so that they trigger the alarm again.
      required: false
      example: "binary_sensor.back_door"
      selector:
        entity:
          multiple: true
          integration: telus_smarthome
          domain: binary_sensor

stop_speaking:
  name: Stop speaking through camera
  description: >-
    Stop the clip currently playing through a TELUS camera's speaker. The stream
    ends within a few tens of milliseconds. Stopping when nothing is playing is
    not an error, so this is safe to call unconditionally from an automation.
  fields:
    entity_id:
      name: Camera
      description: Target TELUS camera entity. Defaults to the doorbell if omitted.
      required: false
      selector:
        entity:
          integration: telus_smarthome
          domain: camera

unpair_arming_device:
  name: Unpair a phone from Bluetooth disarming
  description: >-
    Remove a paired phone from the alarm panel's Bluetooth disarming, so it can
    no longer disarm the alarm on approach. THIS CANNOT BE UNDONE FROM HOME
    ASSISTANT: re-pairing needs physical access to both the phone and the
    panel. Takes one phone at a time on purpose; there is no unpair-all.
  fields:
    entity_id:
      name: Paired phone
      description: >-
        The "Disarm alarm on arrival" switch belonging to the phone to unpair.
      required: true
      example: switch.someones_phone_disarm_alarm_on_arrival
      selector:
        entity:
          integration: telus_smarthome
          domain: switch
